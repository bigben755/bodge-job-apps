name: Apply Bodge Job enquiry form

on:
  push:
    branches: ["main"]
    paths:
      - "scripts/apply-enquiry-form.py"
      - ".github/workflows/apply-enquiry-form.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply enquiry form
        run: python scripts/apply-enquiry-form.py

      - name: Commit updated homepage
        run: |
          if git diff --quiet -- index.html; then
            echo "No homepage changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add website enquiry form and Admin link [skip ci]"
          git push origin HEAD:main
