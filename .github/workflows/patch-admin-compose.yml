name: Patch Bodge Job admin compose

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-compose.yml'
      - 'scripts/patch-admin-compose.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add compose UI to admin dashboard
        run: python scripts/patch-admin-compose.py
      - name: Commit compose interface
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Add admin email compose with attachments"
            git push
          fi
